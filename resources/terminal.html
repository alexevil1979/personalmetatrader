<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonalMetaTrader</title>
<link rel="stylesheet" href="/assets/terminal.css">
</head>
<body>
<header id="toolbar">
  <span class="brand">PMT</span>
  <select id="category" title="Рынок">
    <option value="linear">USDT/USDC Perp</option>
    <option value="spot">Spot</option>
    <option value="inverse">Inverse</option>
  </select>
  <input id="symbolInput" list="symbolList" placeholder="Символ" autocomplete="off" spellcheck="false">
  <datalist id="symbolList"></datalist>
  <div class="sep"></div>
  <div id="tfButtons" class="btngroup"></div>
  <div class="sep"></div>
  <div id="typeButtons" class="btngroup">
    <button data-type="candles" class="on" title="Японские свечи">Свечи</button>
    <button data-type="bars" title="Бары OHLC">Бары</button>
    <button data-type="line" title="Линия">Линия</button>
    <button data-type="ha" title="Heikin Ashi">HA</button>
  </div>
  <div class="sep"></div>
  <div id="layoutButtons" class="btngroup">
    <button data-layout="1" class="on" title="1 график">▢</button>
    <button data-layout="2" title="2 графика">◫</button>
    <button data-layout="4" title="4 графика">⊞</button>
  </div>
  <label class="chk" title="Синхронизировать символ и ТФ между графиками"><input type="checkbox" id="syncAll"> синхр.</label>
  <div class="sep"></div>
  <select id="tz" title="Часовой пояс"><option value="UTC">UTC</option><option value="local">Локальное</option></select>
  <select id="theme" title="Тема"><option value="dark">Тёмная</option><option value="light">Светлая</option></select>
  <span class="grow"></span>
  <button id="btnMql" title="Скрипты и индикаторы MQL4/MQL5">MQL</button>
  <button id="btnInd" title="Индикаторы">ƒ Индикаторы</button>
  <button id="togWatch" class="on" title="Обзор рынка">Обзор</button>
  <button id="togInfo" class="on" title="Нижняя панель">Инфо</button>
  <span id="userBox" class="hidden"><span id="userEmail"></span> <button id="btnLogout" title="Выйти">Выйти</button></span>
  <span id="conn" class="dot off" title="WebSocket"></span>
</header>

<main>
  <aside id="watch">
    <div class="panel-title">Обзор рынка</div>
    <input id="watchFilter" placeholder="Фильтр">
    <div id="watchList"></div>
  </aside>
  <aside id="toolsWrap"><div id="tools"></div>
    <div id="objBar" class="hidden"><div id="objName"></div><input type="color" id="objColor" title="Цвет"><input type="number" id="objWidth" min="1" max="6" title="Толщина"><button id="objDel">Удалить</button></div>
    <button id="objClear" title="Удалить все объекты">Очистить</button></aside>
  <section id="charts"></section>
</main>

<footer id="info">
  <div id="infoGrid"></div>
</footer>

<div id="indDlg" class="dlg hidden"><div class="dlgbox">
  <div class="dlghead"><b>Индикаторы</b> <span id="indFor"></span><button id="indClose">✕</button></div>
  <div class="dlgrow"><select id="indAdd"></select><button id="indAddBtn">Добавить</button>
    <span class="grow"></span><select id="tplSel"></select><button id="tplApply">Применить</button><button id="tplSave">Сохранить шаблон</button><button id="tplDel">Удалить</button></div>
  <div id="indList"></div>
</div></div>

<div id="mqlDlg" class="dlg hidden"><div class="dlgbox mqlbox">
  <div class="dlghead"><b>MQL: библиотека</b><span id="mqlMsg"></span><button id="mqlClose">✕</button></div>
  <div class="dlgrow"><input type="file" id="mqlFile" accept=".mq4,.mq5,.ex4,.ex5"><button id="mqlNew">Новый индикатор</button></div>
  <div class="mqlcols"><div id="mqlList"></div>
    <div id="mqlEd" class="hidden">
      <div class="dlgrow"><input id="mqlName" placeholder="Имя"><select id="mqlVer"></select><button id="mqlSave">Сохранить версию</button><button id="mqlDesc">Разобрать</button><button id="mqlRun" class="on">Добавить на график</button><button id="mqlLogsBtn">Логи</button><button id="mqlDel">Удалить</button></div>
      <div id="mqlInputs"></div>
      <textarea id="mqlSrc" spellcheck="false"></textarea>
      <pre id="mqlLogs" class="hidden"></pre>
    </div></div>
</div></div>

<div id="authDlg" class="dlg"><div class="dlgbox authbox">
  <div class="dlghead"><b id="authTitle">Вход</b></div>
  <input id="authEmail" type="email" placeholder="Email" autocomplete="username">
  <input id="authPass" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="authGo" class="on">Войти</button>
  <div id="authLinks"></div><div id="authMsg"></div>
</div></div>

<script src="/assets/vendor/lightweight-charts.js"></script>
<script src="/assets/indicators.js"></script>
<script src="/assets/drawings.js"></script>
<script src="/assets/terminal.js"></script>
</body>
</html>
