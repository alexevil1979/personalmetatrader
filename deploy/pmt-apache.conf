# Dedicated vhost on its own port; does not touch other sites.
# Install: copy to /etc/apache2/sites-available/personalmetatrader.conf, a2ensite, reload.
Listen 18088
<VirtualHost *:18088>
    ServerName pmt.local
    DocumentRoot /ssd/www/personalmetatrader/public

    <Directory /ssd/www/personalmetatrader/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    # Only index.php is executed by PHP 8.3-FPM; everything else is static.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-pmt.sock|fcgi://localhost"
    </FilesMatch>

    # Block non-public project dirs even if docroot is misconfigured
    <DirectoryMatch "/(src|storage|database|config|bin|deploy)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/pmt_error.log
    CustomLog ${APACHE_LOG_DIR}/pmt_access.log combined
</VirtualHost>
